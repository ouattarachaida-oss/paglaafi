<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Configuration Application Mobile Native (PWA Standalone) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PagLaafi" />
    <meta name="application-name" content="PagLaafi" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- Référencement SEO & Métadonnées officielles PagLaafi Burkina Faso -->
    <title>PagLaafi - Écosystème Numérique & Solidaire contre le Cancer du Sein | Burkina Faso</title>
    <meta name="description" content="PagLaafi : information médicale, géolocalisation en temps réel des centres de dépistage à Ouagadougou, Bobo-Dioulasso et Koudougou, calendrier de cycle et autopalpation guidée au Burkina Faso. Powered by Rose IA." />
    <meta name="keywords" content="PagLaafi, Rose IA, cancer du sein, dépistage précoce, autopalpation, santé des femmes, Ouagadougou, Bobo-Dioulasso, Koudougou, Burkina Faso, solidarité médicale, dons Orange Money" />
    <meta name="author" content="PagLaafi - Santé & Solidarité Féminine Burkina Faso" />
    <meta name="theme-color" content="#9c3d61" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:title" content="PagLaafi - Écosystème Numérique & Solidaire contre le Cancer du Sein" />
    <meta property="og:description" content="Information médicale, orientation en temps réel vers les centres de soins et accompagnement solidaire au Burkina Faso. Propulsé par Rose IA." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="PagLaafi Burkina Faso" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PagLaafi - Santé & Solidarité Féminine au Burkina Faso" />
    <meta name="twitter:description" content="Orientation en temps réel des centres de soins et suivi du cycle avec Rose IA au Burkina Faso." />

    <!-- Favicon PagLaafi -->
    <link rel="icon" type="image/png" href="/icons/icone-192.png" />

    <!-- Manifeste PWA : généré et injecté au build par vite-plugin-pwa (serveur/pwa.ts) -->
    <!-- Feuille de style Leaflet : importée depuis le paquet npm (src/paglaafi/etat/useEtatCentres.ts) -->

    <!-- Police unique : DM Sans (4 graisses), chargement non bloquant -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Thème choisi dans le menu du profil (clair / sombre), appliqué avant l'affichage -->
    <script>
      try {
        var t = localStorage.getItem("paglaafi_theme");
        if (t === "clair") document.documentElement.dataset.theme = "light";
        else if (t === "sombre") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- L'enregistrement du Service Worker se fait dans src/main.tsx (production uniquement) -->
  </body>
</html>
