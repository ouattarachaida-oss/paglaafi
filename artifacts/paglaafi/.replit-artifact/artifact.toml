kind = "mobile"
previewPath = "/"
title = "PagLaafi"
description = "Application mobile d'information et d'orientation autour du cancer du sein au Burkina Faso, avec ressources éducatives, annuaire de démonstration clairement signalé et accompagnement."
version = "1.0.0"
id = "artifacts/paglaafi"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22502

[services.development]
run = "pnpm --filter @workspace/paglaafi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/paglaafi", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/paglaafi", "run", "serve" ]

[services.env]
PORT = "22502"
BASE_PATH = "/"
